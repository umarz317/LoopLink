name: Desktop

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check public tree for credentials
        run: python3 scripts/check_public_tree.py
      - name: Desktop tests
        run: ./gradlew -p desktop test
